spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_dev
    username: finance_user
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
    
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
    context-path: /
logging:
  file:
    name: logs/monolith.log
  level:
    root: INFO